# What's new: shown under Settings → App version and after the app updates itself. Newest first; the
# first entry is the app version. Add an entry (with today's date) with each release people will
# notice, in both languages, numbered major.minor.patch: patch (1.0.8 → 1.0.9) for fixes and small
# improvements, minor (1.0.9 → 1.1.0) for a new feature, major (1.1.0 → 2.0.0) for a big change to how
# the app works.
- version: "1.20.1"
  date: 2026-11-18
  en:
    - "Supplies: Combine now works the way round you would expect. The item you opened is the one that is kept, and the item you pick moves into it as a brand. Before, it was the other way round: opening \"Face Wash\" and picking a product removed Face Wash. The button is now called \"Combine another item into this one\", and the page and the question it asks say which item keeps its name."
    - "Supplies: Restocked with a purchase date in the past no longer makes the item look used up. Logging a face wash bought in September used to show \"0 now · Probably out\" and a made-up usage rate, because the purchase was placed before the count you already had. Now the stock is added to what you have today; the purchase date is only used for prices and expiry."
    - "Supplies › All: a shorter list. Under an item's name there is only its category, and Last bought shows the store and price without the product's name. Each brand's number and name are still on the To Buy, Stocked and Favorites cards, when you tap \"Used 1\", and on the item's page."
  zh-TW:
    - "日用品：合併的方向改成比較直覺的方式。你打開的品項會保留，你選的品項會搬進來變成它的一個品牌。之前剛好相反：打開「洗面乳」再選一個商品，被移除的是「洗面乳」。按鈕改名為「把另一個品項合併進來」，頁面和確認訊息都會寫出哪個品項保留名稱。"
    - "日用品：按「已補貨」並填過去的購買日期，不會再讓品項看起來已經用完。之前記錄一瓶九月買的洗面乳，會顯示「目前 0 個 · 可能用完了」和一個憑空算出來的用量，因為那筆購買被排在你已經盤點的數量之前。現在補貨的數量會直接加到你目前的庫存上，購買日期只用於價格和到期日。"
    - "日用品 › 全部：清單更精簡。品項名稱下方只顯示分類，「上次購買」只顯示商店和價格，不再顯示商品名稱。各品牌的名稱和數量仍然會顯示在「該補貨」、「還夠用」和「我的最愛」的卡片上、按「用掉 1」時，以及品項頁面裡。"
- version: "1.20.0"
  date: 2026-11-17
  en:
    - "Supplies: an item can now be deleted. Edit has a \"Delete item\" button under Archive item. It removes the item for good, with its history, old prices, barcodes and stars, and asks first. Expenses already in the Ledger stay. Archive still only hides an item."
    - "Supplies: \"Combine with another item\" on Edit. If you saved one item per product (two shampoos as two items), pick the item to keep and the other moves into it as a brand. The counts are added, the purchases keep their prices and stores, and \"Used 1 bottle\" then asks which brand."
    - "After you delete an item, a receipt whose items are all gone can be added again."
  zh-TW:
    - "日用品：品項現在可以刪除。「編輯」裡的「封存此項目」下方多了「刪除品項」按鈕，會永久刪除品項，連同記錄、舊價格、條碼和星號，刪除前會先詢問。已記入帳本的支出會保留。封存仍然只是隱藏。"
    - "日用品：「編輯」多了「和另一個品項合併」。如果同一種東西每個商品各存成一個品項（兩瓶洗髮精存成兩個品項），選擇要保留的品項，另一個就會搬進去變成它的一個品牌。數量會相加，購買記錄保留價格和商店，之後按「用掉 1 瓶」會問是哪個品牌。"
    - "刪除品項後，如果某張發票的品項都已經不在，那張發票可以重新加入。"
- version: "1.19.2"
  date: 2026-11-17
  en:
    - "The English screens now use English for most Taiwanese names and bill terms: Taiwan Power Company, Taiwan Water, ShinTao Gas, customer number, payment deadline, invoice. A few terms printed on the bills and emails themselves stay in Chinese so you can match them."
    - "In English, the month headings under Coming Up read \"2026 / 11\" instead of \"2026 11月\"."
  zh-TW:
    - "英文介面的台灣公司名稱和帳單用語大多改成英文（例如台電、台水、欣桃天然氣、用戶編號、繳費期限、發票）。少數印在帳單和電子郵件上的用語維持中文，方便對照。"
    - "英文介面「即將到期」的月份標題改成「2026 / 11」，不再是「2026 11月」。繁體中文介面沒有變動。"
- version: "1.19.1"
  date: 2026-11-17
  en:
    - "Supplies: a category you name on the item form is saved in the language you are using. In English it becomes the category's English name, in 繁體中文 its Chinese name, and the note under the field says which. Before, it always went in the Chinese name."
    - "A supply category needs a name in one language only. People using the other language see that name until theirs is added. A category you already added with only an English name has moved to the English field."
    - "Settings › Categories: a supply category with one name shows a yellow \"Add the Chinese name\" or \"Add the English name\" tag that opens Edit, where the empty name is marked. The tag appears only when someone in the ledger uses that language."
  zh-TW:
    - "日用品：在品項表單新增的類別，會存成你正在使用的語言。英文介面存成英文名稱，繁體中文介面存成中文名稱，欄位下方的說明會寫清楚。以前一律存成中文名稱。"
    - "日用品類別只要有一種語言的名稱就可以。使用另一種語言的人，在補上名稱之前會看到現有的名稱。之前新增、只有英文名稱的類別，已經移到英文名稱欄位。"
    - "「設定 › 類別」：只有一個名稱的日用品類別會顯示黃色的「補上中文名稱」或「補上英文名稱」標籤，點了會開啟編輯，沒填的名稱會標示出來。帳本裡有人使用那種語言時，標籤才會出現。"
- version: "1.19.0"
  date: 2026-11-17
  en:
    - "Supplies: categories are now your own. The Category list on an item's form ends with \"＋ New category…\": type a name such as Shampoo or Face wash and it is saved with the item, for everyone in the ledger to pick."
    - "Settings › Categories has a new Supplies section, where owners and co-owners add, rename, archive and delete supply categories. Every ledger starts with the six there were before and your items stay where they are. \"Other\" always stays, for anything without a category."
    - "Each supply category has a \"Goes off quickly\" switch: its items warn a week before an expiry date instead of a month. It is on for Food & drink and Health, as before."
    - "The All tab filters by your own categories and has an \"Edit categories\" link. On the item form, \"Kind\" is now called \"Category\"."
  zh-TW:
    - "日用品：類別現在可以自己訂。品項表單的「類別」清單最後一項是「＋ 新增類別…」：輸入名稱（例如洗髮精、洗面乳），就會和品項一起儲存，帳本的成員都能選用。"
    - "「設定 › 類別」多了「日用品」區塊，擁有者和共同擁有者可以新增、改名、封存和刪除日用品類別。每個帳本一開始都有原本的六個類別，既有品項的類別不變。「其他」固定保留，放沒有類別的品項。"
    - "每個日用品類別都有「容易過期」開關：打開後，裡面的品項會在到期前一週提醒，而不是一個月前。「食品飲料」和「保健醫療」和以前一樣是打開的。"
    - "「全部」分頁用你自己的類別篩選，並多了「編輯類別」連結。"
- version: "1.18.2"
  date: 2026-11-17
  en:
    - "Supplies: the \"−1 Used one\" button now says what it takes off, in the item's own unit: \"Used 1 bottle\", \"Used 1 roll\", \"Used 1 pack\". It reads the same on the To Buy, Stocked and Favorites cards, in the All list and on an item's page, and the hints name the button the same way."
  zh-TW:
    - "日用品：「−1 用掉一個」按鈕現在會寫出用掉的是什麼，用的是品項自己的單位：「用掉 1 瓶」、「用掉 1 捲」、「用掉 1 包」。「該補貨」、「還夠用」、「我的最愛」的卡片、「全部」清單和品項頁面都一樣，提示文字也用同樣的名稱。"
- version: "1.18.1"
  date: 2026-11-17
  en:
    - "Every page starts higher: the empty space above the page's title is gone, so a little more fits on the first screen."
    - "What's New lists 1.16.0 and 1.15.1 again. They were missing, and 1.17.0 showed the wrong notes."
  zh-TW:
    - "每個頁面都往上移了一些：標題上方的空白拿掉了，第一個畫面可以多顯示一點內容。"
    - "「更新內容」重新列出 1.16.0 和 1.15.1。之前這兩版不見了，1.17.0 顯示的內容也不對。"
- version: "1.18.0"
  date: 2026-11-17
  en:
    - "New: when an item has two or more brands in stock, −1 asks \"Which one did you use?\" and lists only the brands that still have some, the one bought first on top. Pick the bottle you finished and that brand goes down by one. An item with one brand keeps the single tap."
    - "The lists show how many of each brand are left under the item's name (2 Lux Shampoo 750ml · 1 Pantene Shampoo 700ml). The total, the run-out date and the restock alert are still one for the whole item."
    - "An item's page has a new \"In stock by brand\" box: each brand with what is left, where it was bought, its price and its own −1. Inventory asks one number per brand, and History says which brand each used one was."
  zh-TW:
    - "新功能：一個項目有兩個以上的品牌有庫存時，按 −1 會問「用掉哪一個？」，只列出還有庫存的品牌，最早買的排在最上面。選用完的那一個，該品牌就減一。只有一個品牌的項目還是按一下就好。"
    - "清單會在項目名稱下方顯示各品牌還剩幾個（2 Lux Shampoo 750ml · 1 Pantene Shampoo 700ml）。總數、用完日期和補貨提醒仍然是整個項目共用一個。"
    - "項目頁面多了「各品牌庫存」：每個品牌剩多少、在哪裡買、價格，以及各自的 −1。盤點時每個品牌各填一個數字，記錄也會寫用掉的是哪個品牌。"
- version: "1.17.0"
  date: 2026-11-17
  en:
    - "Favorites: each owner and co-owner now has their own star, in their own colour. The star button on an item is yours; a small tag with an initial beside it (★ S) is someone else's star. The stars you had so far are now the Ledger owner's."
    - "Supplies › Favorites lists every item anyone starred, counted once even when two people starred it. With more than one person starring, a \"Starred by\" row (Everyone, Me, and each name) shows only one person's stars, and its chips are the key to the colours."
    - "Taking your star off an item leaves other people's stars on it, so it stays in Favorites until nobody has it starred. An item's page says \"Also starred by\" with the names."
  zh-TW:
    - "我的最愛：擁有者和每位共同擁有者現在都有自己的星星，各有各的顏色。品項上的星星按鈕是你的；旁邊帶著名字第一個字的小標籤（★ S）是別人加的星星。原本的星星現在算是帳本擁有者的。"
    - "日用品 ›「我的最愛」會列出有人加星的所有品項，兩個人都加星的也只算一項。有兩人以上可以加星時，會多一排「誰加的星」（所有人、我，以及每個人的名字），可以只看某個人的星星，這排也說明每個顏色是誰。"
    - "取消你的星星不會動到別人的星星，所以要等到沒有人加星，品項才會離開我的最愛。品項頁面會寫「也加了星」和名字。"
- version: "1.16.0"
  date: 2026-11-17
  en:
    - "New: one supply item can be several brands. When you scan the barcode of a brand you haven't scanned before, the New item form offers \"It's one of my items\": pick the item (say Shampoo), and the barcode is remembered for it. Every brand shares the item's count, usage and restock alert, so you are told once when shampoo as a whole runs low."
    - "Restocked has a new \"Product or brand (optional)\" field. A scan fills it in, a receipt keeps the line's text, and by hand you can pick a brand you bought before or leave it empty. The product shows in History, Price history and Where to buy, so you can compare what each brand cost, and in the lists under Last bought."
    - "Supplies › All: the search also finds an item by a brand you bought it as. Edit lists the item's barcodes, with Remove for one linked by mistake."
  zh-TW:
    - "新功能：一個日用品項目可以有好幾個品牌。掃描沒掃過的品牌條碼時，「新增項目」表單會出現「這是我已有的項目」：選好項目（例如洗髮精），條碼就會記在它上面。所有品牌共用這個項目的數量、用量和補貨提醒，所以洗髮精整體快用完時只會提醒一次。"
    - "「已補貨」多了「品名或品牌（選填）」欄位。掃描會自動填入，發票會保留品項文字，手動輸入時可以選以前買過的品牌或留空。品名會顯示在記錄、價格記錄和哪裡買，方便比較各品牌的價格，也會顯示在清單的上次購買。"
    - "日用品 ›「全部」：搜尋也能用買過的品牌找到項目。編輯頁會列出項目的條碼，連結錯的可以移除。"
- version: "1.15.1"
  date: 2026-11-16
  en:
    - "Supplies › All: the filters are switches now, and you can choose as many as you like. Several categories show the items in any of them, Expiring keeps only the expiring ones among them, a chosen filter turns blue with a ✕ (tap it again to clear it), and “Showing 3 of 10” with Clear all appears while the list is narrowed."
    - "Supplies › All: the All and Buy soon filters are gone, since the All tab and the To Buy tab already show those lists. Expiring appears only when something is expiring, and the category filters now show on a phone too."
  zh-TW:
    - "日用品 ›「全部」：篩選條件現在是開關，可以同時選好幾個。選多個分類會顯示屬於其中任何一類的品項，「快過期」只留下其中快過期的；選取的條件會變成藍色並帶有 ✕（再點一次就取消），清單被縮小時會顯示「顯示 10 項中的 3 項」和「全部清除」。"
    - "日用品 ›「全部」：拿掉了「全部」和「準備補貨」這兩個篩選，因為「全部」分頁和「該補貨」分頁已經是那兩份清單。「快過期」只在有東西快過期時才出現，手機上現在也會顯示分類篩選。"
- version: "1.15.0"
  date: 2026-11-16
  en:
    - "New: Favorites in Supplies. The owner and co-owners can star an item, on its card, in the All list or with the Favorite button on its page, and the new Favorites tab lists the household's starred items, the ones to restock soonest first. Everyone in the household sees the same favorites."
  zh-TW:
    - "新功能：日用品的「我的最愛」。擁有者和共同管理者可以在品項卡片、「全部」清單或品項頁的「我的最愛」按鈕替品項加上星星；新的「我的最愛」分頁會列出家裡加上星星的品項，最快要補貨的排在前面。家裡每個人看到的我的最愛都一樣。"
- version: "1.14.11"
  date: 2026-11-16
  en:
    - "Supplies on a computer: To Buy and Stocked list their groups one under another in a single column, instead of two or three columns side by side."
  zh-TW:
    - "電腦上的日用品頁：「該補貨」和「還夠用」分頁的分組改成由上到下排成一欄，不再並排成兩、三欄。"
- version: "1.14.10"
  date: 2026-11-16
  en:
    - "Supplies item page: the count box under the forecast is now labelled \"Inventory:\" instead of \"Confirmed Amount? I have\"."
  zh-TW:
    - "日用品品項頁：庫存預測下方的數量欄位改稱「盤點」，不再是「確認過數量？還有」。"
- version: "1.14.9"
  date: 2026-11-16
  en:
    - "Supplies › All: the Left column shows just the number over the bar (\"9\" instead of \"9 bottles\"), like the Total at the bar's other end."
  zh-TW:
    - "日用品的「全部」分頁：「剩餘」欄的庫存條上方只顯示數字（「9」，不再是「9 瓶」），和另一端的「總數」一樣。"
- version: "1.14.8"
  date: 2026-11-16
  en:
    - "Supplies in Traditional Chinese: restocking is called 補貨 everywhere, in the To Buy groups, the alerts and the item settings, the tab is named 「該補貨」 wherever it is mentioned, and \"Restock soon\" is 「準備補貨」 everywhere."
  zh-TW:
    - "日用品用詞統一為「補貨」：「該補貨」分頁的分組、提醒通知和品項設定都改用「補貨」（例如「7 天內要補貨」「某日前補貨」的說法），提到分頁時一律寫「該補貨」，「快補貨」一律改為「準備補貨」。"
- version: "1.14.7"
  date: 2026-11-16
  en:
    - "Supplies: ‹ Back to Supplies on an item now returns to where you opened it from, the same tab, filter and search, instead of always To Buy."
    - "Supplies: the stock bar now shows its Total over its right end, the most you had right after a restock. On the item page it reads \"Total: 25 bottles\", in the lists just \"Total: 25\"."
  zh-TW:
    - "日用品：品項頁的「‹ 回到日用品」現在會回到你打開它的地方，同一個分頁、篩選和搜尋，不再一律回到「該補貨」。"
    - "日用品：庫存條的右上方現在會顯示「總數」，也就是補貨後最多有過的數量。品項頁顯示「總數：25 瓶」，清單裡只顯示「總數：25」。"
- version: "1.14.6"
  date: 2026-11-16
  en:
    - "Supplies wording: \"Buy now\" and \"Buy soon\" are now \"Restock now\" and \"Restock soon\", \"Bought more\" is \"Restocked\" and \"Forecast\" is \"Stock Forecast\". Several hints are reworded to be clearer."
    - "Electricity settings in English: the 電號 field is now labelled \"Electricity Account Number\". In Traditional Chinese, reminders say 電子郵件 instead of Email and 保養維修 for maintenance."
  zh-TW:
    - "日用品用詞調整：「該買了」改為「該補貨」、「快要買」改為「快補貨」、「又買了」改為「已補貨」、「預測」改為「庫存預測」，幾段說明文字也改得更清楚。"
    - "提醒與通知的用詞調整：「Email」改稱「電子郵件」，「該保養」改為「該保養維修」。英文介面的「電號」改為「Electricity Account Number」。"
- version: "1.14.5"
  date: 2026-11-16
  en:
    - "New in the bottom bar: the Add new sheet now also closes when you tap or click anywhere outside it, not only on Cancel."
  zh-TW:
    - "底部列的「新增」：除了按「取消」，點一下選單以外的任何地方也會關閉選單。"
- version: "1.14.4"
  date: 2026-11-16
  en:
    - "Bills on a computer: the To Pay, Coming Up and All tabs now work like the Supplies tabs. Under the pointer a tab stands on the line as a press-button card in its own colour (rose, sky, grey), and the tab you're on is filled in its colour. To Pay is red instead of blue, on a phone too."
  zh-TW:
    - "電腦上的帳單頁：「待繳」「即將到來」「全部」分頁現在和日用品頁的分頁一樣。滑鼠移上去時，分頁會變成一張有邊框和陰影的卡片，各用自己的顏色（玫瑰紅、天藍、灰）；目前所在的分頁也會填上自己的顏色。「待繳」改用紅色，不再是藍色，手機上也一樣。"
- version: "1.14.3"
  date: 2026-11-16
  en:
    - "Supplies on a computer: under the pointer, the To Buy, Stocked and All tabs stand on the line as a press-button card in their own colour (rose, sky, grey), and the tab you're on is filled in its colour. To Buy is red instead of blue, on a phone too."
  zh-TW:
    - "電腦上的日用品頁：滑鼠移到「該買了」「還夠用」「全部」分頁時，分頁會變成一張有邊框和陰影的卡片，各用自己的顏色（玫瑰紅、天藍、灰）；目前所在的分頁也會填上自己的顏色。「該買了」改用紅色，不再是藍色，手機上也一樣。"
- version: "1.14.2"
  date: 2026-11-16
  en:
    - "Supplies on a computer: the To Buy, Stocked and All tabs round their top corners and fill lightly under the pointer, the current tab in its own colour."
  zh-TW:
    - "電腦上的日用品頁：滑鼠移到「該買了」「還夠用」「全部」分頁時，上方會變圓角並淡淡上色；目前所在的分頁用它自己的顏色。"
- version: "1.14.1"
  date: 2026-11-16
  en:
    - "Safer sign-up: the link in the confirmation email works right away in the browser you signed up in. In any other browser it asks for your sign-up password first, so nobody else can confirm an account in your name."
    - "Changing your email: the confirmation link works only while you're signed in to your account. Signed out, it asks you to sign in first."
    - "Your name is one line of up to 60 characters, and a ledger can have up to 10 other emails that forward bills."
    - "Forwarded bill emails are checked more strictly, and one email that can't be read no longer holds up the others."
    - "Forwarding a bill email by hand now adds it only when the owner or a co-owner sends it. A viewer, or another email that forwards, uses the Gmail filter as before."
  zh-TW:
    - "註冊更安全：確認信裡的連結，在你註冊時用的瀏覽器會直接生效；在其他瀏覽器會先請你輸入註冊時設定的密碼，別人就無法用你的名義確認帳號。"
    - "變更電子郵件：確認連結只有在登入你的帳號時才有效；還沒登入的話，會先請你登入。"
    - "名稱限一行、最多 60 個字；每本帳本最多可以有 10 個其他會轉寄帳單的 Email。"
    - "轉寄的帳單信會檢查得更嚴格，而且一封讀不了的信不會再卡住其他的信。"
    - "手動轉寄帳單 Email：只有擁有者或共同管理者寄的才會加進帳本。檢視者和其他會轉寄的 Email 照舊用 Gmail 篩選器轉寄。"
- version: "1.14.0"
  date: 2026-11-16
  en:
    - "Supplies › an item's page has a new Price history under History: every price you paid, with the product name, store, amount, price and date, newest first. ★ marks the lowest price per unit."
    - "Add an old price saves what something cost before, even if you've used it all up. It's only for comparing: it shows in Price history and Where to buy, and doesn't change how many you have, the forecast or the Ledger."
  zh-TW:
    - "「日用品」› 品項頁面在「記錄」下方新增「價格記錄」：列出每次買的品名、商店、數量、價格和日期，最新的在最上面。★ 標示每單位最便宜的價格。"
    - "「新增舊價格」可以記下以前買過的價格，就算已經用完也可以。只用來比價：會出現在「價格記錄」和「去哪買」，不會改變你還有多少、預測或帳本。"
- version: "1.13.3"
  date: 2026-11-16
  en:
    - "Supplies › All: every item has a Details › button, like the To Buy and Stocked cards, so it's clear where to open an item."
  zh-TW:
    - "日用品 › 全部：每個品項都有「查看明細 ›」按鈕，和「該買了」、「還夠用」的卡片一樣，一看就知道從哪裡打開。"
- version: "1.13.2"
  date: 2026-11-16
  en:
    - "Supplies on a phone: All shows how many items there are, like To Buy and Stocked (and like on a computer)."
  zh-TW:
    - "手機上的日用品：「全部」也會顯示有幾項，和「該買了」、「還夠用」一樣（也和電腦版一樣）。"
- version: "1.13.1"
  date: 2026-11-16
  en:
    - "Review items: the Add to list shows your supplies under their category (Toiletries, Cleaning, Food & drink…), the same categories as the item form."
    - "Printed receipt on a phone: \"0 of 2 QR codes read\" and its hint now sit under the receipt picture."
  zh-TW:
    - "檢查品項：「加到」清單依類別（盥洗用品、清潔用品、食品飲料…）列出你的日用品，和日用品表單的類別一樣。"
    - "手機上的紙本發票：「已讀取 0／2 個 QR Code」和說明移到發票示意圖下方。"
- version: "1.13.0"
  date: 2026-11-16
  en:
    - "New › Add a receipt: choose a printed receipt (its two QR codes) or invoice PDFs (發票明細 from a store's email or order page, up to 10 at a time). PDFs are read on your device and never uploaded."
    - "Review items lists every item by invoice with its quantity, unit price and subtotal. Shipping fees start skipped, you can change a quantity, exclude an invoice or mark a store as not a supplies store, and Not included shows duplicates, receipts added before and PDFs with only a total."
    - "A printed receipt now shows \"1 of 2 QR codes read\" with a picture of the receipt: the two QR codes aren't boxes to tick. New › Scan product barcode is just for barcodes."
  zh-TW:
    - "「新增」›「新增發票」：可以選紙本發票（兩個 QR Code）或發票明細 PDF（商店寄來或訂單頁下載的，一次最多 10 個）。PDF 在你的裝置上讀取，不會上傳。"
    - "「檢查品項」依發票列出每個品項的數量、單價和小計。運費一開始就略過；可以改數量、不加某張發票，或標記某家店不是日用品店。「沒有加入」會列出重複的、之前加過的，以及只有總額的 PDF。"
    - "紙本發票現在會顯示「已讀取 1／2 個 QR Code」和發票示意圖：兩個 QR Code 不是要勾選的方框。「新增」›「掃描商品條碼」只用來掃條碼。"
- version: "1.12.3"
  date: 2026-11-16
  en:
    - "Supplies no longer has its own Add supply button on a computer. As on Bills, you add things from New at the top (Supply item, scan, Log a purchase…), so there's one place to look."
  zh-TW:
    - "電腦版的日用品頁不再有自己的「新增日用品」按鈕。和帳單一樣，從上方的「新增」加入（日用品項目、掃描、記錄購買…），只要找一個地方。"
- version: "1.12.2"
  date: 2026-11-15
  en:
    - "When you use the last one of a supply (or the app estimates none are left), −1 turns off and a pop-up says it's time to restock, with Bought more, Undo and Later. Still have some? Update the count and −1 comes back."
  zh-TW:
    - "日用品用掉最後一個（或 App 估計已經沒有了）時，「−1」會停用，並跳出提醒該補貨，可以按「又買了」、「復原」或「稍後」。其實還有剩的話，更新數量後「−1」就會恢復。"
- version: "1.12.1"
  date: 2026-11-15
  en:
    - "Supplies › All on a computer works like Bills › All: the tabs, filters and the table's column headings stay at the top while the items scroll under them."
  zh-TW:
    - "在電腦上，日用品 › 全部和帳單 › 全部一樣：分頁、篩選和表格的欄位標題固定在上方，項目在下面捲動。"
- version: "1.12.0"
  date: 2026-11-15
  en:
    - "Supplies now works like Bills: To Buy (opens first) shows what to buy now in three groups, Out Or Buy Now, Buy In The Next 7 Days and Expiring, with a Next up line; Stocked shows what's enough for now by the month it moves to To Buy; All is the full list with filters and search."
    - "Each group has its own colour (red, amber, violet, and grey for Not Enough Data Yet), softer in dark mode and easier to tell apart."
  zh-TW:
    - "日用品改成和帳單一樣：「該買了」（最先打開）把現在要買的分成三組：用完或現在就買、7 天內要買、快過期，並顯示「下一個」；「還夠用」依移到「該買了」的月份排列；「全部」是完整清單，可以篩選和搜尋。"
    - "每組有自己的顏色（紅、琥珀、紫，資料不足是灰色），深色模式下更柔和、更好分辨。"
- version: "1.11.5"
  date: 2026-11-15
  en:
    - "On a computer, Edit, Bought more and Log a purchase on Supplies open their window on the first click (it sometimes needed a second click)."
  zh-TW:
    - "在電腦上，日用品的「編輯」、「又買了」和「記錄購買」第一次點就會打開視窗（之前有時要點第二次）。"
- version: "1.11.4"
  date: 2026-11-15
  en:
    - "Getting Started now explains Supplies: tap \"−1 Used one\" now and then, log what you buy, and get a reminder to restock before something runs out."
    - "A supply item's page (and New, Edit, Scan and Log a purchase) now has ‹ Back to Supplies at the top, to the Supplies list, instead of Back to Dashboard."
  zh-TW:
    - "使用說明加入「日用品」：偶爾按「用掉一個」、記錄購買，東西用完前就會收到補貨提醒。"
    - "日用品項目頁（以及新增、編輯、掃描和記錄購買）上方改為「‹ 回到日用品」，回到日用品清單，不再是「回到首頁」。"
- version: "1.11.3"
  date: 2026-11-15
  en:
    - "New supply item has \"I already bought these\": when you bought them, how many, the price and store. With how many you have now, the app knows right away how fast you use them and when they'll run out, instead of starting from \"Not enough data yet\"."
    - "Edit on a supply item now shows its latest purchase, so you can correct the price, store, date or quantity (its Ledger expense is updated too), or add what you paid if you skipped it at first."
  zh-TW:
    - "新增日用品多了「這些是已經買好的」：購買日期、數量、價格和商店。加上現在還有幾個，App 馬上就知道你們用多快、什麼時候會用完，不必從「資料不足」開始。"
    - "編輯日用品時會顯示上次購買，可以修改價格、商店、日期或數量（帳本支出也會一起更新）；一開始沒填的話，也可以在這裡補上。"
- version: "1.11.2"
  date: 2026-11-15
  en:
    - "When a scanned barcode isn't in any product database, a message pops up asking you to type the name, kind and unit yourself; the barcode is remembered for next time. Receipt lines that match none of your supplies are flagged the same way, with their name fields open."
    - "Read the name from a photo has been removed: it needed very sharp photos and often found nothing."
  zh-TW:
    - "掃描的條碼在商品資料庫查不到時，會跳出訊息請你自己輸入名稱、類別和單位；這個條碼會被記住，下次直接使用。發票上對不到任何日用品的品項也會同樣提示，並打開名稱欄位。"
    - "已移除「從照片讀取名稱」：它需要非常清楚的照片，常常讀不到。"
- version: "1.11.1"
  date: 2026-11-15
  en:
    - "New supply item has Read the name from a photo: take a photo of the front of the package and tap the product name from the text it finds. The photo is read on your device and never uploaded, handy for products whose barcode no database knows."
    - "On Supplies, Add supply and Add your first supply open a menu: Supply item, Upload or scan barcode / receipt, and Log a purchase…"
  zh-TW:
    - "新增日用品多了「從照片讀取名稱」：拍包裝正面，從辨識出的文字點選商品名稱。照片在你的裝置上讀取，不會上傳，適合條碼查不到的商品。"
    - "日用品頁的「新增日用品」和「新增第一項日用品」會打開選單：日用品項目、上傳或掃描條碼／發票、記錄購買…"
- version: "1.11.0"
  date: 2026-11-15
  en:
    - "New Supplies page: keep track of the things your household keeps in stock (toilet paper, shampoo, oat milk). Each item shows how many are left, when it should run out and when to buy more. The app learns how fast you use it from your purchases and counts."
    - "−1 Used one updates the count in place with an Undo; Bought more logs a restock with its price, store and expiry date, and can also add it to the Ledger as an expense. Each item shows the price per unit, the cheapest store and how much you've spent on it."
    - "Supply alerts at 9:00 each morning, on for owners and co-owners: when it's time to buy, when something has probably run out, and when some of it will expire before you use it. If the push doesn't reach any device, it comes by email. Turn it off in My Account → Notifications."
    - "Scan a product barcode to add an item or log a purchase (names come from Open Food Facts and other product databases; only the number is sent), or scan both QR codes on a Taiwan e-invoice (發票) to log every line at once, with one Ledger expense for the whole receipt. Photos are read on your device and never uploaded."
    - "One + New menu in the header (and New in the tab bar) for Upload or scan, Supply item, Log a purchase… and Bill / record."
  zh-TW:
    - "新增「日用品」頁面：追蹤家裡常備的東西（衛生紙、洗髮精、燕麥奶）。每一項都會顯示還剩多少、預計何時用完、該在何時補貨。App 會從你的購買和數量記錄學會你們用多快。"
    - "按「−1 用掉一個」會直接更新數量，並可復原；「又買了」記錄補貨的價格、商店和到期日，也可以同時加入帳本記為支出。每一項都會顯示單價、最便宜的商店，以及在這項花了多少錢。"
    - "日用品提醒每天早上 9 點發送，擁有者和共同擁有者預設開啟：該買了、可能用完了、有些會在用完前過期時都會通知。推播沒送達任何裝置時改寄 Email。可在「我的帳戶 → 通知」關閉。"
    - "掃描商品條碼就能新增項目或記錄購買（名稱來自 Open Food Facts 等商品資料庫，只會送出條碼號碼）；也可以掃描電子發票的兩個 QR Code，一次記錄每一行，整張發票在帳本記一筆支出。照片在你的裝置上讀取，不會上傳。"
    - "頁首的「+ 新增」選單（以及下方的「新增」）整合了上傳或掃描、日用品項目、記錄購買…和帳單／記錄。"
- version: "1.10.1"
  date: 2026-11-15
  en:
    - "Getting Started uses today's button names (Record Payment, Remind Me Later), explains To Pay and Coming Up and the Bill paid notification, and has a new step for whoever receives 台電 or 台水 bill emails."
  zh-TW:
    - "使用說明改用現在的按鈕名稱（記錄繳費、稍後提醒），說明「待繳」和「即將到來」以及「帳單已繳費」通知，並新增一步給會收到台電或台水帳單 Email 的人。"
- version: "1.10.0"
  date: 2026-11-15
  en:
    - "Ledger settings has a new Water (台水) page: each 台灣自來水 帳單通知 email fills in the 水費 bill with its amount and 繳費期限 (or adds it), and the 繳費成功通知 email marks it paid, with a Bill paid notification. The 115年10月 bill is the 7月-8月 bill."
    - "台水's emails go to the same forwarding address as 台電's, so whoever already forwards 台電 only adds one Gmail filter (from:water.gov.tw). The setup email now names every company that's turned on, with one filter for all of them."
    - "If 台水's bill email is a week late, the owner is told, the same as for 台電."
  zh-TW:
    - "帳本設定新增「水費（台水）」頁面：台灣自來水的帳單通知 Email 會補上水費帳單的金額和繳費期限（沒有就新增），繳費成功通知 Email 會把帳單標示已付款，並發出帳單已繳費通知。115年10月的帳單就是 7月-8月 的帳單。"
    - "台水的 Email 和台電共用同一個轉寄地址，已經在轉寄台電的人只要再加一個 Gmail 篩選器（from:water.gov.tw）。設定信現在會列出所有已開啟的公司，用一個篩選器涵蓋全部。"
    - "台水的帳單 Email 逾期一週沒收到時，會像台電一樣通知擁有者。"
- version: "1.9.0"
  date: 2026-11-15
  en:
    - "Electricity has a clearer page: a status at the top (Setting up, Waiting or Forwarding works, with the latest bill and when the next 台電 email is expected), then Set up forwarding as 3 steps, each showing what's done and what needs you."
    - "Step 1 lists everyone who can forward 台電's emails. The owner sends each one the setup email with one tap (Send or Resend) and sees when it went; Add & send adds another Gmail and emails it straight away."
    - "The setup email now has a Copy address button that opens a page with just the forwarding address, so it's easy to copy on a phone."
    - "Recent activity is folded away until you open it."
  zh-TW:
    - "電費頁面更清楚了：最上方顯示狀態（設定中、等待中或轉寄正常，加上最近一期帳單和下一封台電 Email 預計何時寄達），下面是分成 3 個步驟的「設定轉寄」，每一步都標出已完成或需要你處理。"
    - "步驟 1 列出所有可以轉寄台電 Email 的人。擁有者點一下就能寄設定信（寄設定信或重寄），也看得到寄出時間；「新增並寄出」會加入另一個 Gmail 並馬上寄信。"
    - "設定信裡多了「複製地址」按鈕，會打開只顯示轉寄地址的頁面，在手機上也很好複製。"
    - "最近紀錄預設收合，點開才會顯示。"
- version: "1.8.0"
  date: 2026-11-15
  en:
    - "Electricity: the forwarding address and the Gmail steps are now part of the Settings card, above the bill settings, so everything to set up is in one place."
    - "When the owner adds an email under Other Emails That Forward, that address gets an email with the ledger's forwarding address and the Gmail steps, so the person who receives 台電's emails can set it up themselves."
  zh-TW:
    - "電費：轉寄地址和 Gmail 設定步驟現在和帳單設定放在同一張「設定」卡片裡，所有設定都在同一個地方。"
    - "擁有者在「其他會轉寄的 Email」新增 Email 時，那個地址會收到一封信，附上帳本的轉寄地址和 Gmail 設定步驟，讓收到台電 Email 的人可以自己設定。"
- version: "1.7.1"
  date: 2026-11-15
  en:
    - "Electricity: the next 台電 email is now expected 2 months after the latest bill's 收費日 (shown as Latest 台電 bill), so a missed bill is noticed on time, whoever forwarded the last one."
    - "Until the Gmail filter forwards its first 台電 email the page says so (Waiting for the Gmail filter's first 台電 email), even when bills have been forwarded by hand."
  zh-TW:
    - "電費：下一封台電 Email 現在預計在最近一期帳單收費日的 2 個月後寄達（顯示為「最近一期台電帳單」），不論上一封是誰轉寄的，漏收時都能及時發現。"
    - "Gmail 篩選器轉寄第一封台電 Email 之前，頁面會顯示「等待 Gmail 篩選器轉寄第一封台電 Email」，即使已有手動轉寄的帳單。"
- version: "1.7.0"
  date: 2026-11-15
  en:
    - "Electricity bills now look after themselves: each 台電 電費通知 email that reaches the ledger fills in the 電費 bill with its amount and 繳費期限 (or adds it), and the 電費已繳通知 email marks it paid, with a Bill paid notification."
    - "A bill you entered ahead is matched by its period (the 115年10月 bill is 7月-8月) and filled in, never added twice. Bills already paid are never changed, and an amount that differs from 台電's is only listed for you to check."
    - "The first bill email sets the ledger's 電號; emails for any other 電號 are then ignored. Recent activity on the Electricity page shows what each email did."
  zh-TW:
    - "電費帳單現在會自動處理：轉寄到帳本的台電電費通知 Email 會補上電費帳單的金額和繳費期限（沒有就新增），電費已繳通知 Email 會把帳單標示已付款，並發出帳單已繳費通知。"
    - "你事先輸入的帳單會依期間比對並補上資料（115年10月的帳單就是 7月-8月），不會重複新增。已付款的帳單不會被更改；金額和台電不同時只會列出讓你確認。"
    - "第一封帳單 Email 會設定帳本的電號，之後其他電號的 Email 都會被略過。電費頁面的最近紀錄會顯示每封 Email 做了什麼。"
- version: "1.6.0"
  date: 2026-11-15
  en:
    - "Bill paid notifications: when a gas (or, later, electricity) bill is marked paid automatically, you get one message listing the bills, in the inbox and by push. If the push can't reach any of your devices, or none confirms it within an hour, it comes by email instead."
    - "It's on for owners and co-owners. Turn it off with the new Bill paid checkbox under My Account → Notifications."
  zh-TW:
    - "帳單已繳費通知：瓦斯費（之後也包括電費）自動標示為已付款時，會發一則列出這些帳單的通知，出現在 App 內並以推播傳送。推播無法送到任何裝置，或一小時內沒有裝置確認收到時，改寄 Email。"
    - "擁有者和共同擁有者預設開啟，可在「我的帳戶 → 通知」取消勾選新的「帳單已繳費」關閉。"
- version: "1.5.1"
  date: 2026-11-15
  en:
    - "Electricity: Gmail now confirms forwarding with a link instead of a code, so the Electricity page shows a Confirm Forwarding button. It appears only when a member (or an email you allowed) asked."
    - "A 台電 email forwarded by hand by a member is accepted too, so older bills can be sent in."
    - "The Electricity page shows when the next 台電 email is expected. If it's a week late, the owner gets a notification to check the 台灣電力 App and the Gmail filter, once per missed bill."
  zh-TW:
    - "電費：Gmail 現在改用連結確認轉寄，不再寄確認碼，所以電費頁面會顯示「確認轉寄」按鈕。只有成員（或你允許的 Email）提出要求時才會出現。"
    - "成員手動轉寄的台電 Email 也會被接受，可以把舊帳單寄進來。"
    - "電費頁面會顯示下一封台電 Email 預計何時寄達。逾期一週還沒收到，會通知擁有者到台灣電力 App 確認帳單並檢查 Gmail 篩選器，每期只通知一次。"
- version: "1.5.0"
  date: 2026-11-15
  en:
    - "Electricity (台電), in Ledger Settings: turn it on to get this ledger's own forwarding address. Whoever receives 台電's emails sets up Gmail once to forward them there, following the steps on the page."
    - "Gmail's forwarding confirmation code shows up on the Electricity page within about 5 minutes, ready to copy. Co-owners can open the page to see the address and code; only the owner can change it."
    - "Only 台電's own emails, forwarded through a member's Gmail, are accepted. Anything else is ignored, and Recent activity says why. Reading the bill amounts from these emails comes next; emails that arrive before then are kept and read then."
  zh-TW:
    - "帳本設定新增「電費（台電）」：開啟後會產生這本帳本專屬的轉寄地址。收到台電 Email 的人，依照頁面上的步驟在 Gmail 設定一次自動轉寄。"
    - "Gmail 的轉寄確認碼約 5 分鐘內會顯示在電費頁面上，可直接複製。共同擁有者可以打開這個頁面查看地址和確認碼，只有擁有者可以更改設定。"
    - "只接受成員 Gmail 轉寄的台電 Email，其他的信都會被略過，並在最近紀錄說明原因。從這些 Email 讀取帳單金額是下一步；在那之前收到的信會先保留，之後再讀取。"
- version: "1.4.0"
  date: 2026-11-14
  en:
    - "Gas account, in Ledger Settings: connect your 欣桃天然氣 用戶編號 and gas bills look after themselves. Every working day at 11:30 new gas bills are added with their amount and 限繳日, and bills are marked paid once 欣桃天然氣 shows them paid."
    - "Gas bills you already entered or scanned are matched by their period (or due date and amount) and filled in, never added twice. Bills already paid are never changed; an amount that doesn't match 欣桃's is only listed for you to check."
    - "Ledger Settings has a menu of its sections at the left on a computer, and a list of them on a phone: General, Members, Reminder Delivery, Recurring Bills, Categories, Payment Methods, Gas Account, Google Drive Backup, Activity and Danger Zone."
  zh-TW:
    - "帳本設定新增「瓦斯帳號」：連結欣桃天然氣的用戶編號後，每個上班日 11:30 會自動新增瓦斯費（含金額和限繳日），欣桃顯示已繳後自動標示為已付款。"
    - "你已經輸入或掃描的瓦斯費，會依期間（或限繳日和金額）比對並補上資料，不會重複新增。已付款的帳單不會被更改；金額和欣桃不同時，只會列出來讓你確認。"
    - "帳本設定在電腦上左側有選單，手機上則是清單：一般、成員、提醒送達狀態、定期帳單、類別、付款方式、瓦斯帳號、Google 雲端硬碟備份、活動紀錄和危險區域。"
- version: "1.3.0"
  date: 2026-11-14
  en:
    - "Bills has three tabs under the title: To Pay, Coming Up and All, each with its count. On a phone they're one full-width switch."
    - "Coming Up lists what isn't due yet by month, soonest first: bills due more than 30 days from now, and each recurring bill's next one before it's created (in sky blue). Every card says the day it moves to To Pay."
    - "To Pay shows only what needs doing now, with a Next up line naming what joins it next. All says when recurring bills are scheduled but not created yet, with a link to Coming Up."
  zh-TW:
    - "帳單標題下方改成三個分頁：待繳、即將到來、全部，各自顯示筆數。手機上是一整排的切換按鈕。"
    - "「即將到來」依月份列出還沒到期的帳單：30 天後才到期的帳單，以及每個定期帳單尚未建立的下一筆（天藍色）。每張卡片都寫著哪一天會移到待繳。"
    - "「待繳」只列出現在要處理的帳單，上方的「下一筆」會告訴你接下來是哪一筆。「全部」會提示有哪些定期帳單已排定但尚未建立，並連到「即將到來」。"
- version: "1.2.1"
  date: 2026-11-14
  en:
    - "Bills › To Pay: a new Scheduled section shows the next bill of each recurring bill before it's created, with its date and the day it'll be added to your bills. The ledger home shows how many are scheduled."
    - "Recurring maintenance now gets a due date (the day its period starts), so it shows with a date in To Pay and reminds you like other bills."
    - "Fixed: Done on a recurring maintenance record could create a second copy of the next task. Recurring records now take their next due date from the recurring bill."
  zh-TW:
    - "帳單 › 待繳：新增「已排定」區塊，在定期帳單的下一筆建立前就先顯示，包括日期和加入帳單的日子。帳本首頁也會顯示已排定幾筆。"
    - "定期保養現在會有到期日（該期開始的那天），所以會帶著日期出現在待繳，並像其他帳單一樣提醒你。"
    - "修正：在定期保養的紀錄按「完成」，可能會多建立一筆重複的下一次保養。定期紀錄的下次到期日現在由定期帳單決定。"
- version: "1.2.0"
  date: 2026-11-01
  en:
    - "Google Drive Backup, in Ledger Settings: the owner can connect their Google Drive, and every week a CSV of all bills and the bill photos are saved there automatically."
    - "If a ledger's data is ever lost, connect Google Drive on an empty ledger to restore its bills and photos from the backup."
  zh-TW:
    - "帳本設定新增「Google 雲端硬碟備份」：擁有者連結 Google 雲端硬碟後，每週會自動把所有帳單的 CSV 和帳單照片存到雲端硬碟。"
    - "如果帳本資料遺失，在空的帳本連結 Google 雲端硬碟，就能從備份還原帳單和照片。"
- version: "1.1.0"
  date: 2026-10-30
  en:
    - "About This App, in your menu: the app version (now numbered like 1.1.0), Check For Updates and what's new in every version. It moved out of Ledger Settings."
    - "After the app updates itself, a card at the top of the page shows what changed, with See What's New; About This App is marked New, with a dot on your photo, until you open it."
  zh-TW:
    - "選單裡新增「關於此應用程式」：顯示版本（改成 1.1.0 這樣的編號）、檢查更新，以及每個版本的更新內容。原本在帳本設定，現在移到這裡。"
    - "應用程式自動更新後，頁面最上方會出現卡片說明更新了什麼，按「查看更新內容」看全部；「關於此應用程式」會標示「新」，你的頭像上也會有小圓點，打開後就會消失。"
- version: "1.0.8"
  date: 2026-10-27
  en:
    - "My Account: Time Zone is shown read-only; tap the pencil to pick a new one from a dropdown grouped by region (Asia, America, Europe…), or Cancel to keep it."
  zh-TW:
    - "我的帳戶：時區預設為唯讀；點鉛筆圖示就能從依地區分組（亞洲、美洲、歐洲…）的下拉選單選擇新的時區，或按取消保留原本的。"
- version: "1.0.7"
  date: 2026-10-26
  en:
    - "Ledger home: one Bills card shows what's to pay (overdue, due in 30 days and the most urgent bills) and the last 3 bills paid, side by side on a computer; tap it to open Bills. Recurring Bills, Categories and Payment Methods sit below under Ledger Setup."
    - "My Account: Signed-in Devices is folded; tap it to see the list and Sign Out All Other Devices."
    - "My Account: one Choose Photo button; picking a photo saves it right away, and the new photo shows at once (it used to keep showing the old one for a few minutes)."
    - "The ledger home lists Bills To Pay, All Bills, Recurring Bills, Categories and Payment Methods. Expense Analysis, Members, Ledger Settings and Import moved off it, since the header, the ledger menu and Bills › All already have them; the ledger menu button in the header is now a press button."
    - "Households are now called ledgers, so one can hold a home's bills and another a company's. Yours keep their names, records and members; the menu reads + New Ledger and Ledger Settings."
    - "Header: a household menu on the left, named after the household you're in (switch households, Household Settings, Members, + New Household), and your menu on the right (My Account, Theme and Language switches, Getting Started, Sign Out). On a phone they open from the bottom of the screen, and the ☰ menu is gone."
    - "Bills › All: search and the filters are folded behind a Filters button until you need them; the filters in use show as tags you can remove one by one."
    - "Pending and Records are now one Bills page: To Pay (what's still to pay, most urgent first, side by side on a computer) and All (every bill, with the filters at the side on a computer and one compact row per record), switched at the top. Export CSV and Import sit above the All list. The header has Bills and Expense Analysis; the phone tab bar has Bills, Analysis and New Record."
    - "New Record: Scan the Bill's Barcodes. Point the camera (or use a photo) at the 3 barcodes in the 條碼區 on the bottom part of a bill, and the amount, due date, year and category are filled in. The first bill from each biller asks once which category it is. Scanning a bill that's already recorded warns you."
    - "Scanning a bill checks your records before filling in the form: a bill already recorded shows that record instead (open it, or scan another bill), and a record you typed in yourself for the same category and period asks whether it's the same bill; saying yes saves the bill number on it."
  zh-TW:
    - "帳本首頁：一張「帳單」卡片顯示待繳（逾期、30 天內到期和最急的帳單）和最近繳清的 3 筆，電腦上左右並排；點一下就打開帳單。定期帳單、類別和付款方式放在下方「帳本設定項目」。"
    - "我的帳戶：「已登入的裝置」預設收合，點一下就能看到清單和「登出其他所有裝置」。"
    - "我的帳戶：只剩一個「選擇照片」按鈕，選好照片就直接儲存，新照片也會馬上顯示（以前會繼續顯示舊照片幾分鐘）。"
    - "帳本首頁只列待繳帳單、全部帳單、定期帳單、類別和付款方式。支出分析、成員、帳本設定和匯入已從首頁移除，因為頁首、帳本選單和「帳單 › 全部」都有；頁首的帳本選單按鈕改成按壓式按鈕。"
    - "「家庭」改名為「帳本」，可以一本記家裡的帳單、一本記公司的。原有的帳本名稱、記錄和成員都不變；選單改為「＋ 新帳本」和「帳本設定」。"
    - "頁首：左邊是以目前家庭命名的家庭選單（切換家庭、家庭設定、成員、＋ 新家庭），右邊是你的選單（我的帳戶、外觀和語言切換、使用說明、登出）。手機上會從畫面下方打開，不再有 ☰ 選單。"
    - "帳單 › 全部：搜尋和篩選收在「篩選」按鈕裡，需要時再打開；使用中的篩選會顯示成標籤，可以一個一個移除。"
    - "「待處理」和「記錄」合併成一個「帳單」頁面：上方切換「待繳」（還沒繳的帳單，最急的在前，電腦上並排顯示）和「全部」（所有帳單，電腦上篩選在側邊，每筆一列）。匯出 CSV 和匯入在「全部」清單上方。頁首有「帳單」和「支出分析」；手機下方分頁列有帳單、支出分析和新增記錄。"
    - "新增記錄：掃描帳單條碼。用相機（或照片）對準帳單下方「條碼區」的 3 條條碼，就會自動填入金額、到期日、年份和類別。每個代收單位第一次會問一次是哪個類別；掃到已經記錄過的帳單會提醒你。"
    - "掃描帳單時會先檢查記錄再填表：已經記錄過的帳單會直接顯示那筆記錄（可以打開或改掃另一張）；同類別、同期間有自己輸入的記錄時，會先問是不是同一張帳單，選「是」就會把銷帳編號存到那筆記錄。"
- version: "1.0.6"
  date: 2026-10-25
  en:
    - "Pending: a Due Later section lists unpaid bills due more than 30 days from now, so every unpaid bill shows on the page."
    - "‹ Back is now ‹ Back to Dashboard and always takes you to the household home (it used to step back through pages, sometimes into a form you had already saved)."
    - "Record page: a Past Records button opens the earlier times of the same item (same category and details), newest first, with a link to see them all in Records (‹ Back to Previous Page there returns to the record)."
    - "Adding photos is two numbered steps: ① Choose Photos shows how many you picked with small previews, then ② Upload sends them (it waits until photos are chosen)."
    - "Photos already on a record are recognised: picking one again tags it Already added and leaves it out of the upload, and the server skips any repeat that still gets through."
  zh-TW:
    - "待處理：新增「之後到期」區塊，列出 30 天後才到期的未繳帳單，所有未繳帳單都會出現在這一頁。"
    - "「‹ 返回」改為「‹ 回到首頁」，一律回到家庭首頁（以前會退回上一頁，有時會回到已經儲存過的表單）。"
    - "記錄頁：新增「過去的記錄」按鈕，打開後由新到舊列出同類別、同明細的較早記錄，也可以到記錄頁看全部（那裡的「‹ 回到上一頁」會回到這筆記錄）。"
    - "新增照片改成兩個步驟：①「選擇照片」後會顯示選了幾張和縮圖，再按 ②「上傳」送出（選好照片前無法按）。"
    - "會認出已經在記錄裡的照片：再選到同一張時會標示「已新增過」並不再上傳，萬一還是送出，伺服器也會略過重複的照片。"
- version: "1.0.5"
  date: 2026-10-24
  en:
    - "Record form: split into Billing Details and Payment Details."
    - "Records can have a payment window: Payable From through the Due Date."
    - "The no-due-date reminder fields hide when a due date is set (due-date bills have their own reminder schedule)."
    - "TWD amounts are whole numbers (1536, not 1536.0)."
    - "Make This Recurring on a record that already repeats takes you to your recurring bills instead of making a second one."
    - "Icons on Languages, Save, Filter, Delete, Add, Archive, Edit, Recurring and Mark Paid; smaller chart labels on narrow screens."
    - "Categories: sheet names the import sorts into each category are clearer, with a Remove button that asks first."
    - "Records list: each record is a card you tap to open, showing its status and due date (Mark Paid is on the record page)."
    - "Pending: the same cards, each saying what the bill needs (e.g. 3 days overdue · NT$580 left to pay), with Details and Remind Me Later buttons."
    - "Record page: a status line under the title (e.g. Not paid yet · due in 24 days) replaces the ✅ / ❌."
    - "Record page: Mark Paid is now Record Payment. It opens the form already filled in (paid in full, today, your usual payment method) so you can check it before saving; Edit is still there for changing the bill."
    - "Activity lists fold open like What's New; Cancel is a light amber button."
    - "Maintenance reads as a task: Not done yet / Done on …, To Do / Done tags, and Mark Done instead of Record Payment. The cost you enter when marking it done (parts count, even if you did it yourself) is what it cost."
    - "Home page: an Install the App card, so the app can be put on the home screen before signing up, on Android (one tap) and iPhone/iPad (Safari → Add to Home Screen)."
  zh-TW:
    - "紀錄表單：分成「帳單資訊」和「繳費資訊」兩區。"
    - "紀錄可以設定繳費期間：從「開始繳費日」到「到期日」。"
    - "填了到期日時，隱藏「提醒（無到期日）」欄位（有到期日的帳單有自己的提醒時程）。"
    - "新台幣金額只用整數（1536，而不是 1536.0）。"
    - "已經是定期帳單的紀錄再按「設為定期帳單」，會帶你到定期帳單頁，不會重複建立。"
    - "語言、儲存、篩選、刪除、新增、封存、編輯、定期帳單和標記已繳加上圖示；窄螢幕上的圖表標籤變小。"
    - "類別：匯入時歸到各類別的試算表名稱更清楚，「移除」按鈕會先確認。"
    - "紀錄列表：每筆紀錄是一張卡片，點一下就能開啟，並顯示狀態和到期日（「標記已繳」在紀錄頁上）。"
    - "待處理：改用同樣的卡片，每張寫出帳單該怎麼處理（例如：逾期 3 天 · 還要繳 NT$580），並有「查看明細」和「稍後提醒」按鈕。"
    - "紀錄頁：標題下方改用一行狀態說明（例如：尚未繳費 · 24 天後到期），取代 ✅ / ❌。"
    - "紀錄頁：「標記已繳」改成「記錄繳費」，會打開已填好的表單（全額繳清、今天、常用的付款方式），確認後再儲存；要修改帳單內容仍用「編輯」。"
    - "「活動紀錄」改成像「更新內容」一樣可展開；「取消」改成淺琥珀色按鈕。"
    - "保養改成工作的說法：尚未完成／某日完成、待完成／已完成標籤，以及「標記完成」取代「記錄繳費」。標記完成時填的花費（零件也算，就算是自己動手）就是這次的花費。"
    - "首頁：新增「安裝 App」卡片，註冊前就能把 App 放到主畫面，Android 一鍵安裝，iPhone／iPad 用 Safari →「加入主畫面」。"
- version: "1.0.4"
  date: 2026-10-23
  en:
    - "Dark mode: softer outlines and shadows on buttons and cards."
    - "A soft pinkish-gray page background, in light and dark mode."
    - "Dark mode: buttons keep their light-mode colors, slightly dimmed."
  zh-TW:
    - "深色模式：按鈕和卡片的外框與陰影變得比較柔和。"
    - "頁面背景改為柔和的淡粉灰色（淺色與深色模式皆是）。"
    - "深色模式：按鈕維持淺色模式的顏色，並稍微調暗。"
- version: "1.0.3"
  date: 2026-10-22
  en:
    - "Settings → App version: check for updates; the app updates itself and shows what's new."
    - "Buttons, pills and summary cards press in like real buttons."
    - "Icons in front of Members and Reminder delivery in Settings."
    - "English: buttons, titles, labels and email subjects of two words or more capitalize every word."
  zh-TW:
    - "設定 → 應用程式版本：可檢查更新；應用程式會自動更新並顯示更新內容。"
    - "按鈕、切換鈕和摘要卡片按下去會像真的按鈕一樣凹下。"
    - "設定中的「成員」和「提醒寄送」前面加上圖示。"
    - "英文介面：兩個字以上的按鈕、標題、標籤和郵件主旨，每個字的字首都大寫。"
- version: "1.0.2"
  date: 2026-10-21
  en:
    - "Expense Analysis: Bills by billing cycle for water, electricity and gas, as a timeline or against the same period last year."
    - "Records: unpaid bills first, earliest due date first, and each shows its due date (red once overdue)."
    - "Record form: Amount due and Amount paid, with Not paid yet / Paid in full / Partly paid; a partial amount over the amount due is flagged."
    - "New app icon."
  zh-TW:
    - "支出分析：水費、電費、瓦斯費的帳單期間比較，可看時間軸或與去年同期比較。"
    - "記錄：未繳的排最前面，依到期日由近到遠，並顯示到期日（逾期變紅色）。"
    - "記錄表單：應繳金額與已繳金額，可選尚未繳費／全額繳清／部分繳費；部分金額超過應繳金額時會提示。"
    - "新的應用程式圖示。"
- version: "1.0.1"
  date: 2026-10-20
  en:
    - "Dark mode, with a Light / Dark toggle in the header."
    - "Records: paged list (10 / 20 / 50 per page), unpaid rows highlighted, overdue in red."
    - "Save and Make Recurring on New Record; Make This Recurring on a saved record."
    - "Phone menu: the header links move into a full-screen menu on smaller screens."
    - "Payment methods suggested from the notes in your records."
  zh-TW:
    - "深色模式，頁首可切換淺色／深色。"
    - "記錄：分頁顯示（每頁 10／20／50 筆），未繳的列會標示，逾期為紅色。"
    - "新增記錄可「儲存並設為定期」；已存的記錄可「設為定期帳單」。"
