# What's new: shown under Settings → App version and after the app updates itself. Newest first; the
# first entry is the app version. Add an entry (YYYY.MM.DD, or YYYY.MM.DD.2 for a second one that day)
# with each release people will notice, in both languages.
- version: "2026.10.26"
  date: 2026-10-26
  en:
    - "New Record: Scan the Bill's Barcodes. Point the camera (or use a photo) at the 3 barcodes in the 條碼區 on the bottom part of a bill, and the amount, due date, year and category are filled in. The first bill from each biller asks once which category it is. Scanning a bill that's already recorded warns you."
  zh-TW:
    - "新增記錄：掃描帳單條碼。用相機（或照片）對準帳單下方「條碼區」的 3 條條碼，就會自動填入金額、到期日、年份和類別。每個代收單位第一次會問一次是哪個類別；掃到已經記錄過的帳單會提醒你。"
- version: "2026.10.25"
  date: 2026-10-25
  en:
    - "Pending: a Due Later section lists unpaid bills due more than 30 days from now, so every unpaid bill shows on the page."
    - "‹ Back is now ‹ Back to Dashboard and always takes you to the household home (it used to step back through pages, sometimes into a form you had already saved)."
    - "Record page: a Past Records button opens the earlier times of the same item (same category and details), newest first, with a link to see them all in Records (‹ Back to Previous Page there returns to the record)."
    - "Adding photos is two numbered steps: ① Choose Photos shows how many you picked with small previews, then ② Upload sends them (it waits until photos are chosen)."
    - "Photos already on a record are recognised: picking one again tags it Already added and leaves it out of the upload, and the server skips any repeat that still gets through."
  zh-TW:
    - "待處理：新增「之後到期」區塊，列出 30 天後才到期的未繳帳單，所有未繳帳單都會出現在這一頁。"
    - "「‹ 返回」改為「‹ 回到首頁」，一律回到家庭首頁（以前會退回上一頁，有時會回到已經儲存過的表單）。"
    - "記錄頁：新增「過去的記錄」按鈕，打開後由新到舊列出同類別、同明細的較早記錄，也可以到記錄頁看全部（那裡的「‹ 回到上一頁」會回到這筆記錄）。"
    - "新增照片改成兩個步驟：①「選擇照片」後會顯示選了幾張和縮圖，再按 ②「上傳」送出（選好照片前無法按）。"
    - "會認出已經在記錄裡的照片：再選到同一張時會標示「已新增過」並不再上傳，萬一還是送出，伺服器也會略過重複的照片。"
- version: "2026.10.24"
  date: 2026-10-24
  en:
    - "Record form: split into Billing Details and Payment Details."
    - "Records can have a payment window: Payable From through the Due Date."
    - "The no-due-date reminder fields hide when a due date is set (due-date bills have their own reminder schedule)."
    - "TWD amounts are whole numbers (1536, not 1536.0)."
    - "Make This Recurring on a record that already repeats takes you to your recurring bills instead of making a second one."
    - "Icons on Languages, Save, Filter, Delete, Add, Archive, Edit, Recurring and Mark Paid; smaller chart labels on narrow screens."
    - "Categories: sheet names the import sorts into each category are clearer, with a Remove button that asks first."
    - "Records list: each record is a card you tap to open, showing its status and due date (Mark Paid is on the record page)."
    - "Pending: the same cards, each saying what the bill needs (e.g. 3 days overdue · NT$580 left to pay), with Details and Remind Me Later buttons."
    - "Record page: a status line under the title (e.g. Not paid yet · due in 24 days) replaces the ✅ / ❌."
    - "Record page: Mark Paid is now Record Payment. It opens the form already filled in (paid in full, today, your usual payment method) so you can check it before saving; Edit is still there for changing the bill."
    - "Activity lists fold open like What's New; Cancel is a light amber button."
    - "Maintenance reads as a task: Not done yet / Done on …, To Do / Done tags, and Mark Done instead of Record Payment. The cost you enter when marking it done (parts count, even if you did it yourself) is what it cost."
    - "Home page: an Install the App card, so the app can be put on the home screen before signing up, on Android (one tap) and iPhone/iPad (Safari → Add to Home Screen)."
  zh-TW:
    - "紀錄表單：分成「帳單資訊」和「繳費資訊」兩區。"
    - "紀錄可以設定繳費期間：從「開始繳費日」到「到期日」。"
    - "填了到期日時，隱藏「提醒（無到期日）」欄位（有到期日的帳單有自己的提醒時程）。"
    - "新台幣金額只用整數（1536，而不是 1536.0）。"
    - "已經是定期帳單的紀錄再按「設為定期帳單」，會帶你到定期帳單頁，不會重複建立。"
    - "語言、儲存、篩選、刪除、新增、封存、編輯、定期帳單和標記已繳加上圖示；窄螢幕上的圖表標籤變小。"
    - "類別：匯入時歸到各類別的試算表名稱更清楚，「移除」按鈕會先確認。"
    - "紀錄列表：每筆紀錄是一張卡片，點一下就能開啟，並顯示狀態和到期日（「標記已繳」在紀錄頁上）。"
    - "待處理：改用同樣的卡片，每張寫出帳單該怎麼處理（例如：逾期 3 天 · 還要繳 NT$580），並有「查看明細」和「稍後提醒」按鈕。"
    - "紀錄頁：標題下方改用一行狀態說明（例如：尚未繳費 · 24 天後到期），取代 ✅ / ❌。"
    - "紀錄頁：「標記已繳」改成「記錄繳費」，會打開已填好的表單（全額繳清、今天、常用的付款方式），確認後再儲存；要修改帳單內容仍用「編輯」。"
    - "「活動紀錄」改成像「更新內容」一樣可展開；「取消」改成淺琥珀色按鈕。"
    - "保養改成工作的說法：尚未完成／某日完成、待完成／已完成標籤，以及「標記完成」取代「記錄繳費」。標記完成時填的花費（零件也算，就算是自己動手）就是這次的花費。"
    - "首頁：新增「安裝 App」卡片，註冊前就能把 App 放到主畫面，Android 一鍵安裝，iPhone／iPad 用 Safari →「加入主畫面」。"
- version: "2026.10.23"
  date: 2026-10-23
  en:
    - "Dark mode: softer outlines and shadows on buttons and cards."
    - "A soft pinkish-gray page background, in light and dark mode."
    - "Dark mode: buttons keep their light-mode colors, slightly dimmed."
  zh-TW:
    - "深色模式：按鈕和卡片的外框與陰影變得比較柔和。"
    - "頁面背景改為柔和的淡粉灰色（淺色與深色模式皆是）。"
    - "深色模式：按鈕維持淺色模式的顏色，並稍微調暗。"
- version: "2026.10.22"
  date: 2026-10-22
  en:
    - "Settings → App version: check for updates; the app updates itself and shows what's new."
    - "Buttons, pills and summary cards press in like real buttons."
    - "Icons in front of Members and Reminder delivery in Settings."
    - "English: buttons, titles, labels and email subjects of two words or more capitalize every word."
  zh-TW:
    - "設定 → 應用程式版本：可檢查更新；應用程式會自動更新並顯示更新內容。"
    - "按鈕、切換鈕和摘要卡片按下去會像真的按鈕一樣凹下。"
    - "設定中的「成員」和「提醒寄送」前面加上圖示。"
    - "英文介面：兩個字以上的按鈕、標題、標籤和郵件主旨，每個字的字首都大寫。"
- version: "2026.10.21"
  date: 2026-10-21
  en:
    - "Expense Analysis: Bills by billing cycle for water, electricity and gas, as a timeline or against the same period last year."
    - "Records: unpaid bills first, earliest due date first, and each shows its due date (red once overdue)."
    - "Record form: Amount due and Amount paid, with Not paid yet / Paid in full / Partly paid; a partial amount over the amount due is flagged."
    - "New app icon."
  zh-TW:
    - "支出分析：水費、電費、瓦斯費的帳單期間比較，可看時間軸或與去年同期比較。"
    - "記錄：未繳的排最前面，依到期日由近到遠，並顯示到期日（逾期變紅色）。"
    - "記錄表單：應繳金額與已繳金額，可選尚未繳費／全額繳清／部分繳費；部分金額超過應繳金額時會提示。"
    - "新的應用程式圖示。"
- version: "2026.10.20"
  date: 2026-10-20
  en:
    - "Dark mode, with a Light / Dark toggle in the header."
    - "Records: paged list (10 / 20 / 50 per page), unpaid rows highlighted, overdue in red."
    - "Save and Make Recurring on New Record; Make This Recurring on a saved record."
    - "Phone menu: the header links move into a full-screen menu on smaller screens."
    - "Payment methods suggested from the notes in your records."
  zh-TW:
    - "深色模式，頁首可切換淺色／深色。"
    - "記錄：分頁顯示（每頁 10／20／50 筆），未繳的列會標示，逾期為紅色。"
    - "新增記錄可「儲存並設為定期」；已存的記錄可「設為定期帳單」。"
    - "手機選單：較小的螢幕上，頁首連結收進全螢幕選單。"
    - "依記錄的備註建議付款方式。"
- version: "2026.10.19"
  date: 2026-10-19
  en:
    - "First release: records, import from the sheet, recurring bills, reminders by email, in the app and by push, Expense Analysis, photos and households."
  zh-TW:
    - "第一版：記錄、從試算表匯入、定期帳單、電子郵件／應用程式內／推播提醒、支出分析、照片與家庭。"
