  electricity_forwarding_mailer:
    setup:
      subject: "%{household}: forward 台電's bill emails to Household Tracker"
      intro: "%{owner} added you to %{household} on Household Tracker as someone who receives 台電's bill emails. Set up Gmail once, and each 台電 bill reaches the ledger by itself: the amount and 繳費期限 are filled in, and it's marked paid when 台電's paid notice comes."
      forward_to: "Forward to this address:"
      copy_link: "Copy it on this page:"
      copy_button: "Copy address"
      or_long_press: "or long-press the address to select it"
      how: "In Gmail on a computer (the Gmail that receives 台電's emails):"
      steps:
        - "⚙️ › See all settings › Forwarding and POP/IMAP › Add a forwarding address › paste the address above › Next › Proceed. Leave forwarding itself off."
        - "Gmail asks the ledger to confirm. %{owner} confirms it in Household Tracker, usually within a few minutes; you don't need to do anything."
        - "Once it's confirmed: in Gmail's search box type from:taipower.com.tw › Show search options › Create filter › tick Forward it to › choose the address above › Create filter."
      check: "To check it works, forward one 台電 bill email to the address by hand; it shows up in the ledger within about 5 minutes."
      ignore: "If you don't receive 台電's emails, you can ignore this email."
