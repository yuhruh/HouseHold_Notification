        - "Gmail ⚙️ › See all settings › Forwarding and POP/IMAP › Add a forwarding address › paste the address › Next › Proceed. Leave forwarding itself off."
        - "Gmail asks this ledger to confirm. Within about 5 minutes a Confirm Forwarding button appears below: tap it. (Reload this page to see it.)"
        - "In Gmail's search box type from:taipower.com.tw › Show search options › Create filter › tick Forward it to › choose this address › Create filter."
