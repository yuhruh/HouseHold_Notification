        intro: "Put it on your home screen. It opens full screen, and bill reminders arrive as notifications. Free, no app store needed."
        button: "Install App"
        android_html: "<strong>Android:</strong> tap <strong>Install App</strong>, or open the browser menu <strong>⋮ → Install app</strong> (on some phones \"Add to Home screen\")."
        ios_html: "<strong>iPhone / iPad:</strong> in Safari, tap <strong>Share</strong> <svg class=\"inline h-4 w-4 align-[-3px]\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Share\"><path d=\"M12 3v12M8 7l4-4 4 4\"/><path d=\"M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8\"/></svg> → <strong>Add to Home Screen</strong>. Reminders arrive when you open it from the Home Screen icon."
        after: "You can sign up or sign in inside the app afterwards."
    features:
      page_title: "Features · Household Tracker"
      title: "Features"
      intro: "Household Tracker keeps the bills, maintenance and taxes of a home or a company in one shared ledger, and reminds everyone before things are due. It works on computers and phones, and installs as an app."
      sections:
        records:
          title: "Bills"
          items:
            - "Expense, Maintenance and Tax: category, details, billing period (e.g. Jan. - Feb., Full Year), amount due and paid, Payable From and due dates, paid date, payment method, notes and photos."
            - "One Bills page with two views: To Pay lists what's overdue, due in the next 30 days, maintenance coming up and due later, most urgent first; All lists every record as a compact row."
            - "Status is worked out for you (unpaid, partly paid, paid, overdue), using each person's own date. Remind Me Later pauses a bill's reminders for you only."
            - "Record Payment opens the form already filled in (paid in full, today, your usual payment method); maintenance is a task you Mark Done, with what it cost."
            - "Search and filters (year, month, type, category, status, payment method) stay folded behind a Filters button; the filters in use show as tags, the summary shows Paid totals, and Export CSV saves what the filters show."
            - "Every record keeps a history of changes, and Past Records opens the earlier times of the same item."
            - "On a computer the header stays at the top of every page, and so does the top of each Bills view (the To Pay / All switch; on All also the filters, summary and column headings) while the bills scroll under it."
        scan:
          title: "Scan a bill"
          items:
            - "New Record → Scan the Bill's Barcodes: point the camera, or use a photo, at the 3 barcodes on a Taiwan bill (三段式條碼), and the amount, due date, year and category are filled in."
            - "The first bill from each biller asks once which category it is. Reading happens on your phone; nothing is uploaded until you save."
            - "Before the form is filled your records are checked: a bill already recorded (same bill number) shows that record instead, and a record you typed in yourself for the same category and period asks whether it's the same bill."
        recurring:
          title: "Recurring bills"
          items:
            - "Set a bill up once (water every 2 months, management fee yearly) and the next one is created ahead of time."
            - "Fixed amounts are filled in; variable bills show the last amount as a hint."
            - "Changing a template shows every unpaid bill it affects before anything changes."
        reminders:
          title: "Reminders"
          items:
            - "At most one combined reminder a day per person, at their chosen time (09:00 by default): due soon, due today and overdue."
            - "By push notification (phone and computer), email and the in-app inbox."
            - "A red count on Bills shows the unpaid bills due today or earlier."
            - "If a reminder doesn't arrive, the owner gets a daily summary and can resend it."
        household:
          title: "Ledgers and members"
          items:
            - "Owner, co-owner (edits records) and viewer (read-only). Invite people by email."
            - "Sign in with email and password or Google; one account can belong to several ledgers."
            - "The ledger menu at the top switches ledgers and opens Ledger Settings and Members; your menu has My Account, the theme (light, dark or your device's), the language (English or 繁體中文) and Sign Out."
            - "On a phone, the tab bar at the bottom has Bills, Analysis and New Record. Put it on your home screen like an app (Android: one tap; iPhone and iPad: Safari → Add to Home Screen)."
            - "The activity log shows who did what."
            - "The ledger home has one Bills card: what's to pay (overdue, due in 30 days and the most urgent bills) and the last 3 bills paid. Recurring Bills, Categories and Payment Methods sit below it under Ledger Setup."
            - "My Account: your photo, language, time zone, reminder time and theme; change your email or password, connect Google, choose notifications for each ledger, and see the devices you're signed in on (sign out the others in one tap)."
            - "The app updates itself; Ledger Settings → App Version lists what's new."
        photos:
          title: "Photos"
          items:
            - "Add receipt photos to a bill in two steps, choose then upload; they're downsized and location data is removed."
            - "A photo that's already on the record is recognised and not added twice."
            - "Only ledger members can see them."
        analysis:
          title: "Expense Analysis"
          items:
            - "Spending by type per month (or per year), the water, electricity and gas trend, spending by category and payment method, and a spread of bill amounts."
            - "Water, electricity and gas by billing cycle, as a timeline or against the same period last year."
            - "Click a chart to see the records behind it; choose one year or all years."
            - "Count spending by paid date or by billing period, with totals for what's paid, unpaid and overdue; on a computer these and the filters stay at the top while the charts scroll."
        import:
          title: "Sheet import"
          items:
            - "Import CSV (on Bills › All): upload the sheet's CSV, review the preview (new, changed, unchanged), then commit."
            - "Re-importing the same sheet never duplicates records; keywords in payment notes can set payment methods in one go."
      new_here_html: "New here? See %{link} to install the app and turn on notifications."
      guide_link: "Getting Started"
    guide:
      page_title: "Getting Started · Household Tracker"
      title: "Getting Started"
      intro: "Set it up once in Chrome on your Android phone, and the daily bill reminders arrive on your phone."
      accept:
        title: "1. Accept the invitation"
        items_html:
          - "Open the invitation email (sent from Household Tracker's Gmail address; the first time, check spam too)."
          - "Tap the link and choose \"Create an account\" with <strong>the email the invitation was sent to</strong>, or \"Sign in\" if you already have an account. Google sign-in works too, with a Google account on that same email."
          - "Tap \"Accept\" and you'll see the ledger's bills."
      install:
        title: "2. Install it on your home screen"
        items_html:
          - "Open <code>%{host}</code> in <strong>Chrome</strong> on the phone and sign in."
          - "Tap \"Install App\" at the top, or Chrome's <strong>⋮ → Install app</strong> (on some phones \"Add to Home screen\")."
          - "From now on, open it from the <strong>home-screen icon</strong>."
      notifications:
        title: "3. Turn on notifications"
        items_html:
          - "Open the app from the icon and go to %{link}."
          - "Make sure \"Push\" is ticked for the ledger and tap \"Save\"."
          - "Tap \"Enable notifications\" and choose <strong>Allow</strong> when Chrome asks. \"This browser\" then shows it's on."
          - "To keep amounts off the lock screen, untick \"Show bill names and amounts in notifications (lock screen)\"."
        link: "My Account → Notifications"
        note: "On a new phone, repeat steps 2 and 3 there. Remove the old phone under My Account → Devices."
      on_time:
        title: "4. Keep notifications on time (recommended)"
        body_html: "Android's battery saving can delay notifications. In the phone's <strong>Settings → Apps → Chrome → Battery</strong>, choose <strong>Unrestricted</strong> (names vary by brand). Don't clear Chrome's site data, or you'll need to enable notifications again."
      daily:
        title: "5. What you'll get each day"
        items_html:
          - "At most one combined reminder a day: bills due soon, due today or overdue. It comes at 09:00 by default; change \"Reminder time\" in My Account."
          - "The same reminder also arrives by email and in the in-app inbox (the reminder picture at the top)."
          - "After paying, tap \"Mark paid\" on the bill and nobody gets reminded about it again."
          - "\"Snooze\" quiets one bill for a while, for you only."
          - "\"Add photos\" on a bill keeps a receipt. Location data is removed from photos."
      trouble:
        title: "6. If something goes wrong"
        items_html:
          - "<strong>No notifications:</strong> open the app from the home screen and tap \"Enable notifications\" again in My Account. Email and the in-app inbox still have your reminders."
          - "<strong>Lost phone:</strong> sign in on a computer and remove it under My Account → Devices, or ask the ledger owner to."
          - "<strong>Anything else:</strong> ask the person who invited you."
      privacy: "Privacy policy"
