en:
  activerecord:
    models:
      water_account: "Water Account"
    attributes:
      water_account:
        customer_code: "Water Account Number"
        category_id: "Put Water Bills In"
        category: "Category"
        payment_method_id: "Payment Method For New Bills"
        payment_method: "Payment Method"
        household_id: "Ledger"
    errors:
      models:
        water_account:
          attributes:
            customer_code:
              invalid: "must be the 11 digits of the 水號 on your bill"
              taken: "is already used by another ledger"
            household_id:
              taken: "already has a water account"
  water_accounts:
    show:
      title: "Water (Taiwan Water)"
      intro: "New water bills come from Taiwan Water's e-bill emails, forwarded by whoever receives them, to the same address as Taiwan Power's. The app fills in the bill's amount and payment deadline, and marks it paid when Taiwan Water's payment successful emails arrive."
      customer_code_hint: "Filled in from the first Taiwan Water's email. After that, emails for any other 水號 are ignored."
      disconnect_confirm: "Disconnect water? Taiwan Water's emails are ignored from now on. Bills it added stay in Bills."
      how:
        - "Whoever gets Taiwan Water's e-bill emails sets up Gmail once to forward them to this ledger's address (the same one Taiwan Power's emails use)."
        - "Each email of bill's notification fills in the water bill with its amount and payment deadline, or adds it."
        - "Each payment successful email marks that bill paid, on the day it arrives."
        - "A bill you already entered is matched by its period and filled in, never added twice."
        - "Bills already marked paid are never changed, and nothing is ever deleted."
      status:
        working: "Forwarding works"
        working_hint: "Taiwan Water bills fill in by themselves."
        confirm: "Setting up: step 2 needs you"
        confirm_hint: "Gmail asked to forward emails here. Confirm it in step 2."
        waiting: "Waiting for the Gmail filter's first Taiwan Water email"
        waiting_hint: "Bills fill in by themselves once the Gmail filter forwards its first Taiwan Water email."
      from_first_email: "From the first Taiwan Water email"
      last_bill: "Latest Taiwan Water bill"
      step1:
        title: "Send the setup email to whoever gets Taiwan Water's emails"
      step3:
        title: "Gmail filter forwards Taiwan Water's emails"
        hint: "The forwarder creates a filter for from:water.gov.tw (it's in the setup email). This turns green when the first Taiwan Water email comes through it."
      activity: "Recent activity"
      no_activity: "Nothing yet."
      open_bill: "Open"
      lines:
        added: "Added %{period}: NT$%{amount}, Payment Deadline %{due}"
        added_paid: "Added %{period}, already paid: NT$%{amount}"
        matched: "Filled in your %{period} bill: NT$%{amount}, Payment Deadline %{due}"
        paid: "Marked paid: %{period}, NT$%{amount}"
        amount_differs: "Amount differs for %{period}: you recorded NT$%{recorded}, Taiwan Water billed NT$%{amount}. Not changed."
        needs_a_look: "More than one bill could be %{period} (NT$%{amount}). None was changed."
        ignored: "Ignored an email: %{detail}"
        received: "Received a Taiwan Water email forwarded by %{detail}'s Gmail filter"
        received_by_hand: "Received a Taiwan Water email %{detail} forwarded by hand"
        forwarding_request: "%{detail} asked Gmail to forward here: confirm it above"
        customer_code_set: "Water account number is set to %{detail} from the first Taiwan Water bill email"
        unreadable: "Couldn't read a bill in a Taiwan Water email (%{detail}). Nothing was changed."
    missing_mail:
      title: "%{household}: no Taiwan Water bill email yet"
      body: "Taiwan Water's bill email was expected around %{expected}, 2 months after the last one (%{last}), and hasn't arrived. Check the bill in the Taiwan Water App, and that the Gmail filter still forwards Taiwan Water's emails."
      body_first: "No Taiwan Water bill email has arrived since Water was turned on (%{since}); one was expected around %{expected}. Check the bill in the Taiwan Water App, and that the Gmail filter for from:water.gov.tw is set up."
    update:
      saved: "Water saved."
    destroy:
      disconnected: "Water disconnected. Its bills stay in Bills."
