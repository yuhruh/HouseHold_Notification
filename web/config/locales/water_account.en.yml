en:
  activerecord:
    models:
      water_account: "Water Account"
    attributes:
      water_account:
        customer_code: "水號"
        category_id: "Put Water Bills In"
        category: "Category"
        payment_method_id: "Payment Method For New Bills"
        payment_method: "Payment Method"
        household_id: "Ledger"
    errors:
      models:
        water_account:
          attributes:
            customer_code:
              invalid: "must be the 11 digits of the 水號 on your bill"
              taken: "is already used by another ledger"
            household_id:
              taken: "already has a water account"
  water_accounts:
    show:
      title: "Water (台水)"
      intro: "New 水費 bills come from 台灣自來水公司's 電子帳單 emails, forwarded by whoever receives them, to the same address as 台電's. The app fills in the bill's amount and 繳費期限, and marks it paid when 台水's 繳費成功通知 arrives."
      customer_code_hint: "Filled in from the first 台水 email. After that, emails for any other 水號 are ignored."
      disconnect_confirm: "Disconnect water? 台水's emails are ignored from now on. Bills it added stay in Bills."
      how:
        - "Whoever gets 台水's 電子帳單 emails sets up Gmail once to forward them to this ledger's address (the same one 台電's emails use)."
        - "Each 帳單通知 email fills in the 水費 bill with its amount and 繳費期限, or adds it."
        - "Each 繳費成功通知 email marks that bill paid, on the day it arrives."
        - "A bill you already entered is matched by its period and filled in, never added twice."
        - "Bills already marked paid are never changed, and nothing is ever deleted."
      status:
        working: "Forwarding works"
        working_hint: "台水 bills fill in by themselves."
        confirm: "Setting up: step 2 needs you"
        confirm_hint: "Gmail asked to forward emails here. Confirm it in step 2."
        waiting: "Waiting for the Gmail filter's first 台水 email"
        waiting_hint: "Bills fill in by themselves once the Gmail filter forwards its first 台水 email."
      from_first_email: "From the first 台水 email"
      last_bill: "Latest 台水 bill"
      step1:
        title: "Send the setup email to whoever gets 台水's emails"
      step3:
        title: "Gmail filter forwards 台水's emails"
        hint: "The forwarder creates a filter for from:water.gov.tw (it's in the setup email). Already forwarding 台電? Only this filter is new. This turns green when the first 台水 email comes through it."
      activity: "Recent activity"
      no_activity: "Nothing yet."
      open_bill: "Open"
      lines:
        added: "Added %{period}: NT$%{amount}, 繳費期限 %{due}"
        added_paid: "Added %{period}, already paid: NT$%{amount}"
        matched: "Filled in your %{period} bill: NT$%{amount}, 繳費期限 %{due}"
        paid: "Marked paid: %{period}, NT$%{amount}"
        amount_differs: "Amount differs for %{period}: you recorded NT$%{recorded}, 台水 billed NT$%{amount}. Not changed."
        needs_a_look: "More than one bill could be %{period} (NT$%{amount}). None was changed."
        ignored: "Ignored an email: %{detail}"
        received: "Received a 台水 email forwarded by %{detail}'s Gmail filter"
        received_by_hand: "Received a 台水 email %{detail} forwarded by hand"
        forwarding_request: "%{detail} asked Gmail to forward here: confirm it above"
        customer_code_set: "水號 set to %{detail} from the first 台水 bill email"
        unreadable: "Couldn't read a bill in a 台水 email (%{detail}). Nothing was changed."
    missing_mail:
      title: "%{household}: no 台水 bill email yet"
      body: "台水's bill email was expected around %{expected}, 2 months after the last one (%{last}), and hasn't arrived. Check the bill in the 台灣自來水 App, and that the Gmail filter still forwards 台水's emails."
      body_first: "No 台水 bill email has arrived since Water was turned on (%{since}); one was expected around %{expected}. Check the bill in the 台灣自來水 App, and that the Gmail filter for from:water.gov.tw is set up."
    update:
      saved: "Water saved."
    destroy:
      disconnected: "Water disconnected. Its bills stay in Bills."
