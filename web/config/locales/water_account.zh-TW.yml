        added: "新增 %{period}：NT$%{amount}，繳費期限 %{due}"
        added_paid: "新增 %{period}，已付款：NT$%{amount}"
        matched: "補上你的 %{period} 帳單：NT$%{amount}，繳費期限 %{due}"
        paid: "標示已付款：%{period}，NT$%{amount}"
        amount_differs: "%{period} 金額不同：你記錄 NT$%{recorded}，台水帳單 NT$%{amount}。未更改。"
        needs_a_look: "有不只一筆帳單可能是 %{period}（NT$%{amount}），都沒有更改。"
        ignored: "略過一封 Email：%{detail}"
        received: "收到 %{detail} 的 Gmail 篩選器轉寄的台水 Email"
        received_by_hand: "收到 %{detail} 手動轉寄的台水 Email"
        forwarding_request: "%{detail} 要求 Gmail 轉寄到這裡：請在上方確認"
        customer_code_set: "從第一封台水帳單 Email 設定水號為 %{detail}"
        unreadable: "無法讀取台水 Email 裡的帳單（%{detail}），沒有任何更改。"
