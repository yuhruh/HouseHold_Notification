      body: "台水的帳單 Email 預計在 %{expected} 左右寄達（上一封 %{last} 的 2 個月後），但還沒收到。請到台灣自來水 App 確認帳單，並檢查 Gmail 篩選器是否仍在轉寄台水的 Email。"
      body_first: "開啟水費（%{since}）後還沒收到任何台水帳單 Email，原本預計在 %{expected} 左右寄達。請到台灣自來水 App 確認帳單，並檢查 from:water.gov.tw 的 Gmail 篩選器是否已設定。"
    update:
      saved: "水費設定已儲存。"
    destroy:
      disconnected: "已取消連結水費。已新增的帳單會留在帳單裡。"
