        - "收到台水電子帳單 Email 的人，在 Gmail 設定一次轉寄到這本帳本的地址（和台電的 Email 用同一個）。"
        - "每封帳單通知 Email 會補上水費帳單的金額和繳費期限，沒有就新增。"
        - "每封繳費成功通知 Email 會在收到當天把那筆帳單標示已付款。"
        - "你事先輸入的帳單會依期間比對並補上資料，不會重複新增。"
        - "已付款的帳單不會被更改，也不會刪除任何資料。"
      status:
        working: "轉寄正常"
        working_hint: "台水帳單會自動補上。"
        confirm: "設定中：步驟 2 需要你處理"
        confirm_hint: "Gmail 要求把 Email 轉寄到這裡，請在步驟 2 確認。"
        waiting: "等待 Gmail 篩選器轉寄第一封台水 Email"
        waiting_hint: "Gmail 篩選器轉寄第一封台水 Email 後，帳單就會自動補上。"
      from_first_email: "從第一封台水 Email 取得"
      last_bill: "最近一期台水帳單"
