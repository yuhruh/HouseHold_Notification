  water_accounts:
    show:
      title: "水費（台水）"
      intro: "新的水費帳單來自台灣自來水公司的電子帳單 Email，由收到的人轉寄到和台電相同的地址。App 會補上帳單的金額和繳費期限，收到台水的繳費成功通知時標示已付款。"
      customer_code_hint: "從第一封台水 Email 取得。之後其他水號的 Email 都會被略過。"
