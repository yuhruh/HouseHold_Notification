        title: "寄設定信給收到台水 Email 的人"
      step3:
        title: "Gmail 篩選器轉寄台水 Email"
        hint: "轉寄的人要建立 from:water.gov.tw 的篩選器（設定信裡有步驟）。已經在轉寄台電的話，只需要新增這個篩選器。第一封台水 Email 經篩選器轉寄進來後會變成綠色。"
      activity: "最近紀錄"
      no_activity: "目前沒有紀錄。"
      open_bill: "打開"
