  pages:
    home:
      signed_in_as: "已登入：%{name}"
      households_coming: "家庭與帳單功能即將推出。"
      sign_out: "登出"
      sign_in: "登入"
      sign_up: "建立帳號"
      install:
        title: "安裝 App"
        intro: "把它放到主畫面：開啟時是全螢幕，帳單提醒會以通知送達。免費，不需要應用程式商店。"
        button: "安裝 App"
        android_html: "<strong>Android：</strong>點「<strong>安裝 App</strong>」，或打開瀏覽器選單 <strong>⋮ → 安裝應用程式</strong>（有些手機是「加到主畫面」）。"
        ios_html: "<strong>iPhone / iPad：</strong>在 Safari 點<strong>分享</strong> <svg class=\"inline h-4 w-4 align-[-3px]\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"Share\"><path d=\"M12 3v12M8 7l4-4 4 4\"/><path d=\"M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8\"/></svg> → <strong>加入主畫面</strong>。從主畫面圖示開啟時才會收到提醒。"
        after: "安裝後可以在 App 裡註冊或登入。"
    features:
      page_title: "功能介紹 · Household Tracker"
      title: "功能介紹"
      intro: "Household Tracker 取代家裡的 Google 試算表，記錄水電、保養和稅金，並在到期前提醒每位家人。電腦和 Android 手機都能用，可以安裝成 App。"
      sections:
        records:
          title: "帳單記錄"
          items:
            - "支出、保養、稅金三種類型：類別、期間（例如 1月-2月、全年）、應繳／已繳金額、到期日、繳費日、付款方式、備註和照片。"
            - "狀態自動判斷（未繳、部分繳、已繳 ✅、逾期），用每個人自己的日期計算。"
            - "一鍵「標記已繳」；可依年度、月份、類型、類別、狀態、付款方式和關鍵字篩選，摘要列出已繳金額。"
            - "每筆記錄都有修改歷史，也可以匯出 CSV。"
        recurring:
          title: "定期帳單"
          items:
            - "設定一次（例如水電瓦斯每兩個月、管理費每年），之後會自動提前建立下一期的帳單。"
            - "固定金額會自動填入；金額不固定的帳單會顯示上次金額當參考。"
        reminders:
          title: "提醒"
          items:
            - "每人每天最多一則彙整提醒，在自己設定的時間（預設 09:00）送出：快到期、今天到期、已逾期。"
            - "推播通知（手機和電腦）、Email 和 App 內的收件匣，三個管道都會收到。"
            - "提醒沒送達時，擁有者會收到每日摘要，可以重新寄送。"
        household:
          title: "家庭與成員"
          items:
            - "擁有者、共同擁有者（可編輯記錄）、檢視者（只能看）。用 Email 邀請家人加入。"
            - "可以用 Email 密碼或 Google 登入；一個帳號可以加入多個家庭。"
            - "活動記錄會列出誰做了什麼。"
        photos:
          title: "照片"
          items:
            - "帳單可以附上收據照片；上傳前會縮小，位置等隱藏資訊會被移除。"
            - "只有家庭成員看得到。"
        analysis:
          title: "支出分析"
          items:
            - "每月（或每年）各類型支出、水電瓦斯趨勢、依類別和付款方式的分布，以及帳單金額分布圖。"
            - "點圖表就能看到背後的每一筆記錄；可選單一年度或全部年度。"
        import:
          title: "從試算表匯入"
          items:
            - "上傳試算表的 CSV，先看預覽（新增／更新／未變更），確認後才寫入。"
            - "重複匯入同一份試算表不會產生重複記錄；付款備註裡的關鍵字可以一次設定成付款方式。"
      new_here_html: "第一次使用？請看 %{link}：安裝 App、開啟通知。"
      guide_link: "使用說明"
    guide:
      page_title: "使用說明 · Household Tracker"
      title: "家人使用說明"
      intro: "用 Android 手機的 Chrome 設定一次，之後每天的帳單提醒會直接跳到手機上。"
      accept:
        title: "1. 接受邀請"
        items_html:
          - "打開邀請信（寄件人是 Household Tracker 的 Gmail；第一次請也看一下垃圾郵件）。"
          - "點信中的連結，用<strong>收到邀請的那個 Email</strong>「建立帳號」，或已經有帳號就「登入」。用 Google 登入也可以，但 Google 帳號要是同一個 Email。"
          - "點「接受」，就會看到家裡的帳單。"
      install:
        title: "2. 安裝到手機主畫面"
        items_html:
          - "在手機的 <strong>Chrome</strong> 打開 <code>%{host}</code>，並登入。"
          - "點上方的「安裝 App」，或 Chrome 右上角 <strong>⋮ → 安裝應用程式</strong>（有些手機寫「加到主畫面」）。"
          - "以後都從<strong>主畫面的圖示</strong>打開。"
      notifications:
        title: "3. 開啟通知"
        items_html:
          - "從主畫面圖示打開 App，進入%{link}。"
          - "確認家庭那一列勾了「推播」，按「儲存」。"
          - "按「啟用通知」，Chrome 詢問時選<strong>允許</strong>。「這個瀏覽器」會顯示已開啟。"
          - "不想讓鎖定畫面顯示金額，可以取消「在通知（鎖定畫面）顯示帳單名稱與金額」。"
        link: "「我的帳戶」→「通知」"
        note: "換新手機時，在新手機重做第 2、3 步。舊手機可以在「我的帳戶」→「裝置」移除。"
      on_time:
        title: "4. 讓通知準時（建議）"
        body_html: "Android 省電時可能會延後通知。到手機的<strong>設定 → 應用程式 → Chrome → 電池</strong>，選<strong>不受限制</strong>（各品牌名稱略有不同）。也不要清除 Chrome 的網站資料，否則需要重新啟用通知。"
      daily:
        title: "5. 每天會收到什麼"
        items_html:
          - "每天最多一則整理好的提醒：快到期、今天到期、已逾期的帳單。時間預設早上 9 點，可在「我的帳戶」改「提醒時間」。"
          - "同樣的內容也會寄 Email，並出現在 App 上方的提醒圖示（通知收件匣）。"
          - "繳完後在帳單上按「標記已繳」，大家就不會再收到這筆的提醒。"
          - "暫時不想看到某筆提醒，可以按「稍後提醒」，只對你自己有效。"
          - "帳單頁可以「新增照片」，拍收據或繳費證明。照片的位置資訊會被移除。"
      trouble:
        title: "6. 遇到問題"
        items_html:
          - "<strong>沒收到通知：</strong>從主畫面打開 App，到「我的帳戶」再按一次「啟用通知」。Email 和通知收件匣還是會有提醒。"
          - "<strong>手機遺失：</strong>在電腦登入，到「我的帳戶」→「裝置」移除那支手機，或請家庭擁有者移除。"
          - "<strong>其他問題：</strong>問邀請你的家人。"
      privacy: "隱私權政策"
