production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  confirm_push_receipts:
    class: ConfirmPushReceiptsJob
    schedule: "35 * * * *"
  send_reminders:
    class: SendRemindersJob
    schedule: "5 * * * *"
  generate_recurring_records:
    class: GenerateRecurringRecordsJob
    schedule: "10 0 * * * Asia/Taipei"
  backup:
    class: BackupJob
    schedule: "0 4 * * 0 Asia/Taipei"
  auth_cleanup:
    class: Auth::CleanupJob
    schedule: "30 3 * * * Asia/Taipei"
  spike_gmail_durability:
    class: Spike::GmailDurabilityJob
    schedule: "0 9,20 * * * Asia/Taipei"
